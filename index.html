<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2E1A4F" />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23160C24'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='17' fill='%23E4C878' text-anchor='middle'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<title>Área do Formando — Indaiá Formaturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Área do Formando — Indaiá Formaturas.
   Identidade tirada do site editorial de formaturas
   (vendasindaia.github.io/formatura-decoracao/editorial): mesmos tokens de cor,
   Cormorant Garamond + Montserrat + Daniel (manuscrita), olho-de-seção com
   entrelinha larga, botões retos e o grifo violeta sob as palavras-chave.
   A moldura (menu lateral fixo, gaveta no celular) vem da Área do Cliente. */

@font-face {
  font-family: 'Daniel';
  font-display: swap;
  src: url('Daniel.ttf') format('truetype');
}

:root {
  /* paleta do editorial de formaturas */
  --paper: #F4F1EA;
  --paper-2: #E8E1D4;
  --ink: #191320;
  --ink-soft: #544A5D;
  --ink-mute: #726780;
  --night: #160C24;
  --night-2: #0C0715;
  --cream: #F2E9DA;
  --violet: #7B4EC2;
  --violet-soft: #A986E0;
  --violet-deep: #2E1A4F;
  --accent-txt: #4E2A83;
  --gold: #C9A24B;
  --gold-soft: #E4C878;
  --gold-txt: #7A5C18;
  --emerald: #1F8763;
  --emerald-txt: #0B5C43;
  --rubi: #A3423C;
  --line-dark: rgba(25, 19, 32, .14);
  --line-light: rgba(242, 233, 216, .16);

  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  --manu: 'Daniel', 'Segoe Script', cursive;

  /* papéis na interface */
  --fundo: var(--paper);
  --superficie: #FBF9F4;
  --superficie-2: var(--paper-2);
  --texto: var(--ink);
  --texto-suave: var(--ink-mute);
  --linha: var(--line-dark);
  --positivo: var(--emerald-txt);
  --negativo: var(--rubi);
  --dourado-txt: var(--gold-txt);

  --lateral: 268px;
  --coluna: 980px;
  --sombra: 0 1px 2px rgba(25, 19, 32, .04), 0 12px 32px -18px rgba(25, 19, 32, .3);
  --sombra-violeta: 0 10px 30px rgba(123, 78, 194, .34);
  --raio: 6px;
  --raio-btn: 2px;
  --topo: env(safe-area-inset-top, 0px);
  --base: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo: #2A1B42;
    --superficie: #35244F;
    --superficie-2: #3E2B5B;
    --texto: #F3EDF8;
    --texto-suave: #BCAFCE;
    --linha: rgba(242, 233, 216, .18);
    --positivo: #6FCFA8;
    --negativo: #E89B95;
    --dourado-txt: var(--gold-soft);
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 34px -16px rgba(0, 0, 0, .75);
  }
}
:root[data-tema="escuro"] {
  --fundo: #2A1B42; --superficie: #35244F; --superficie-2: #3E2B5B;
  --texto: #F3EDF8; --texto-suave: #BCAFCE; --linha: rgba(242, 233, 216, .18);
  --positivo: #6FCFA8; --negativo: #E89B95; --dourado-txt: var(--gold-soft);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .serif { font-family: var(--serif); font-weight: 600; letter-spacing: .005em; }
h1 em, h2 em, h3 em, .serif em { font-style: italic; color: var(--accent-txt); font-weight: 400; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) h1 em, :root:not([data-tema="claro"]) h2 em { color: var(--violet-soft); } }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-txt); }

/* olho de seção — o "eyebrow" do site */
.kicker {
  font-size: .68rem; font-weight: 500; letter-spacing: .34em; text-transform: uppercase;
  color: var(--texto-suave);
}
.kicker.traco { display: flex; align-items: center; gap: 14px; }
.kicker.traco::before { content: ""; width: 34px; height: 1px; background: currentColor; opacity: .5; flex: none; }

/* grifo violeta à mão, como no site */
.grifo {
  background-image: linear-gradient(rgba(169, 134, 224, .55), rgba(169, 134, 224, .55));
  background-size: 100% .3em; background-position: 0 92%; background-repeat: no-repeat;
  padding: 0 .08em;
}
.manuscrita { font-family: var(--manu); color: var(--violet); font-size: 1.5rem; line-height: 1; }

/* ---------- splash ---------- */
.carregando { display: grid; place-items: center; min-height: 100vh; }
.splash img { width: 130px; filter: brightness(0); opacity: .35; animation: pulsar 1.4s ease-in-out infinite; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .splash img { filter: none; } }
@keyframes pulsar { 0%, 100% { opacity: .2; } 50% { opacity: .55; } }

/* ---------- entrar ---------- */
.entrar {
  min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
  padding: calc(40px + var(--topo)) 20px calc(40px + var(--base));
  background: radial-gradient(120% 55% at 50% -8%, rgba(123, 78, 194, .18), transparent 60%), var(--fundo);
}
.entrar-caixa { width: 100%; max-width: 410px; margin: 0 auto; }
.marca { text-align: center; margin-bottom: 26px; }
.marca img { width: 150px; max-width: 55%; filter: brightness(0); opacity: .86; }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .marca img { filter: none; opacity: 1; } }
.marca .assinatura { font-family: var(--manu); color: var(--violet); font-size: 1.35rem; margin-top: 14px; }
.entrar .cartao { padding: 28px 26px; margin-bottom: 0; }
.entrar h1 { margin: 10px 0 6px; font-size: 30px; line-height: 1.12; }
.entrar .sub { color: var(--texto-suave); font-size: 13.5px; margin: 0 0 22px; }

.campo { margin-bottom: 15px; }
.campo label { display: block; font-size: .64rem; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 8px; }
.campo input, .campo select {
  width: 100%; padding: 14px 16px; border: 1px solid var(--linha); border-radius: var(--raio-btn);
  background: var(--superficie); outline: none; transition: border-color .15s, box-shadow .15s;
}
.campo input:focus, .campo select:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(123, 78, 194, .16); }
.campo input.codigo { text-align: center; font-size: 26px; letter-spacing: .5em; padding-left: .5em; font-variant-numeric: tabular-nums; }
.campo .dica { font-size: 12px; color: var(--texto-suave); margin-top: 7px; }

.botao {
  width: 100%; padding: 15px 20px; border: 1px solid var(--violet); border-radius: var(--raio-btn);
  cursor: pointer; background: var(--violet); color: #fff; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase; font-size: .7rem;
  box-shadow: var(--sombra-violeta); transition: background .15s, transform .12s, box-shadow .15s;
}
.botao:hover { background: #8f63d6; }
.botao:active { transform: translateY(1px); }
.botao[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.botao.secundario { background: transparent; color: var(--accent-txt); border-color: var(--linha); box-shadow: none; }
.botao.secundario:hover { background: rgba(123, 78, 194, .07); border-color: var(--violet); }
.botao.fantasma {
  background: transparent; color: var(--texto-suave); border-color: transparent; box-shadow: none;
  padding: 12px; letter-spacing: .04em; text-transform: none; font-size: 13px; font-weight: 500;
}
.botao.fantasma:hover { background: transparent; color: var(--texto); }

.erro { color: var(--negativo); font-size: 13px; margin: 10px 0 0; }
.dev {
  margin-top: 18px; padding: 13px 15px; border-radius: var(--raio); font-size: 12.5px;
  background: rgba(201, 162, 75, .13); border: 1px dashed var(--gold); color: var(--dourado-txt);
}
.dev strong { font-size: 18px; letter-spacing: .28em; font-variant-numeric: tabular-nums; color: var(--texto); }

.opcoes-turma { display: grid; gap: 10px; }
.opcao-turma {
  display: block; width: 100%; text-align: left; padding: 15px 16px; border-radius: var(--raio); cursor: pointer;
  background: var(--superficie-2); border: 1px solid var(--linha);
}
.opcao-turma:hover { border-color: var(--violet); }
.opcao-turma strong { display: block; font-family: var(--serif); font-size: 19px; }
.opcao-turma span { color: var(--texto-suave); font-size: 12.5px; }

/* ---------- moldura: menu lateral ---------- */
.app { min-height: 100vh; }

.lateral {
  position: fixed; inset: 0 auto 0 0; width: var(--lateral); z-index: 40;
  display: flex; flex-direction: column;
  background: linear-gradient(168deg, var(--violet-deep), var(--night) 62%, var(--night-2));
  color: var(--cream);
  padding: calc(28px + var(--topo)) 0 calc(18px + var(--base));
}
.lateral-marca { padding: 0 24px 24px; }
.lateral-marca img { width: 118px; }
.lateral-pessoa { padding: 0 24px 20px; border-bottom: 1px solid var(--line-light); margin-bottom: 16px; }
.lateral-pessoa .nome { font-family: var(--serif); font-size: 24px; line-height: 1.18; }
.lateral-pessoa .turma { font-size: .6rem; letter-spacing: .28em; text-transform: uppercase; opacity: .6; margin-top: 6px; }

.lateral nav { display: grid; gap: 2px; padding: 0 12px; }
.lateral nav button {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  padding: 12px; border: 0; border-radius: var(--raio); cursor: pointer;
  background: none; color: rgba(242, 233, 218, .7); font-size: .72rem; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase;
  transition: background .15s, color .15s;
}
.lateral nav button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }
.lateral nav button:hover { background: rgba(242, 233, 218, .07); color: var(--cream); }
.lateral nav button.ativo { background: rgba(169, 134, 224, .18); color: #fff; }
.lateral nav button .aviso {
  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0; padding: 2px 7px;
  border-radius: 99px; background: var(--rubi); color: #fff;
}

.lateral-assinatura { font-family: var(--manu); color: var(--violet-soft); font-size: 1.05rem; white-space: nowrap; padding: 0 24px 4px; opacity: .72; margin-top: auto; }
.lateral-rodape { padding: 10px 12px 0; display: grid; gap: 2px; }
.lateral-rodape button {
  display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
  padding: 11px 12px; border: 0; border-radius: var(--raio); cursor: pointer;
  background: none; color: rgba(242, 233, 218, .58); font-size: 12.5px;
}
.lateral-rodape button:hover { background: rgba(242, 233, 218, .07); color: var(--cream); }
.lateral-rodape svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; flex: none; }

.conteudo { margin-left: var(--lateral); min-height: 100vh; }
.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: calc(18px + var(--topo)) 28px 16px;
  background: color-mix(in srgb, var(--fundo) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--linha);
}
.topo h1 { margin: 0; font-size: 28px; line-height: 1.1; }
.topo .sub { font-size: .62rem; letter-spacing: .26em; text-transform: uppercase; color: var(--texto-suave); margin-top: 4px; }
.topo .abrir-menu { display: none; background: none; border: 0; cursor: pointer; padding: 6px; color: var(--texto); }
.topo .abrir-menu svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; }

main { padding: 26px 28px calc(48px + var(--base)); max-width: var(--coluna); margin: 0 auto; }
.cortina { display: none; }

@media (max-width: 899px) {
  .lateral { transform: translateX(-100%); transition: transform .22s cubic-bezier(.16, 1, .3, 1); box-shadow: 0 0 40px rgba(0, 0, 0, .4); }
  .app.menu-aberto .lateral { transform: none; }
  .app.menu-aberto .cortina { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(12, 7, 21, .5); }
  .conteudo { margin-left: 0; }
  .topo { padding: calc(14px + var(--topo)) 18px 14px; }
  .topo .abrir-menu { display: block; }
  .topo h1 { font-size: 23px; }
  main { padding: 18px 16px calc(40px + var(--base)); }
}

/* ---------- blocos ---------- */
.secao-titulo {
  font-size: .64rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase;
  color: var(--texto-suave); margin: 30px 2px 12px;
}
.secao-titulo:first-child { margin-top: 2px; }

.cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); padding: 22px; margin-bottom: 12px; }
.cartao.plano { box-shadow: none; }
.colunas { display: grid; gap: 12px; margin-bottom: 12px; }
.colunas .cartao:last-child { margin-bottom: 0; }
@media (min-width: 760px) {
  .colunas.duas { grid-template-columns: 1fr 1fr; }
  .colunas.duas > * { height: 100%; margin-bottom: 0; }
}

/* resumo financeiro */
.resumo .valor-grande { font-family: var(--serif); font-size: 46px; line-height: 1; margin: 6px 0; }
.resumo .rotulo, .grade .rotulo, .destaque .rotulo { font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--texto-suave); }
.barra { height: 5px; border-radius: 99px; background: var(--linha); overflow: hidden; margin: 18px 0 10px; }
.barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--gold)); border-radius: 99px; }
.grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--linha); border-radius: var(--raio); overflow: hidden; margin-top: 18px; }
@media (min-width: 760px) { .grade { grid-template-columns: repeat(4, 1fr); } }
.grade > div { background: var(--superficie); padding: 14px 16px; }
.grade b { display: block; font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.grade b.atraso { color: var(--negativo); }
.grade b.pago { color: var(--positivo); }

.faixa { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: var(--raio); font-size: 13px; margin-bottom: 12px; line-height: 1.5; }
.faixa.alerta { background: rgba(163, 66, 60, .1); color: var(--negativo); }
.faixa.info { background: rgba(123, 78, 194, .1); color: var(--accent-txt); }
.faixa.ouro { background: rgba(201, 162, 75, .14); color: var(--dourado-txt); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .faixa.info { color: var(--violet-soft); } }

/* destaque do próximo pagamento */
.destaque {
  background: linear-gradient(150deg, var(--violet-deep), var(--night) 78%);
  color: var(--cream); border: 0; display: flex; flex-direction: column;
}
.destaque .rotulo { color: rgba(242, 233, 218, .55); }
.destaque .valor-grande { font-family: var(--serif); font-size: 44px; line-height: 1; margin: 6px 0 2px; }
.destaque .quando { font-size: 13px; opacity: .8; }
.destaque .acoes { margin-top: auto; padding-top: 20px; }
.destaque .acoes .botao { max-width: 280px; background: var(--cream); border-color: var(--cream); color: var(--violet-deep); box-shadow: none; }
.destaque .acoes .botao:hover { background: #fff; }

/* filtros */
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filtros button {
  padding: 9px 16px; border-radius: 99px; border: 1px solid var(--linha); cursor: pointer;
  background: transparent; color: var(--texto-suave);
  font-size: .62rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
}
.filtros button:hover { border-color: var(--violet-soft); color: var(--texto); }
.filtros button.ativo { background: var(--violet); border-color: var(--violet); color: #fff; }

/* listas */
.lista { border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; background: var(--superficie); box-shadow: var(--sombra); }
.item {
  display: flex; width: 100%; align-items: center; gap: 14px; text-align: left;
  padding: 16px 18px; background: none; border: 0; border-bottom: 1px solid var(--linha); cursor: pointer;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--superficie-2); }
.item .quando { flex: 1; min-width: 0; }
.item .quando strong { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.2; }
.item .quando span { font-size: 12px; color: var(--texto-suave); }
.item .quanto { text-align: right; white-space: nowrap; }
.item .quanto b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; }
.item .seta { color: var(--texto-suave); font-size: 18px; line-height: 1; }
.item.inerte { cursor: default; }
.item.inerte:hover { background: none; }

.marca-status { display: inline-block; font-size: .56rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; margin-top: 6px; }
.s-pago { background: rgba(31, 135, 99, .14); color: var(--positivo); }
.s-em_aberto { background: rgba(123, 78, 194, .14); color: var(--accent-txt); }
.s-em_atraso { background: rgba(163, 66, 60, .14); color: var(--negativo); }
.s-agendado { background: rgba(201, 162, 75, .18); color: var(--dourado-txt); }
.s-nao_gerado { background: var(--superficie-2); color: var(--texto-suave); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) .s-em_aberto { color: var(--violet-soft); } }

/* linha do tempo */
.tempo { position: relative; padding-left: 26px; }
.tempo::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: var(--linha); }
.tempo-item { position: relative; padding: 0 0 22px; }
.tempo-item:last-child { padding-bottom: 0; }
.tempo-item::before { content: ""; position: absolute; left: -23px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--superficie); border: 1px solid var(--linha); }
.tempo-item.futuro::before { border-color: var(--violet); }
.tempo-item.proximo::before { background: var(--violet); border-color: var(--violet); box-shadow: 0 0 0 4px rgba(123, 78, 194, .18); }
.tempo-item .data { font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--texto-suave); }
.tempo-item h3 { margin: 3px 0; font-size: 21px; }
.tempo-item p { margin: 0; font-size: 13px; color: var(--texto-suave); }

.aviso-turma { border-left: 2px solid var(--gold); padding: 2px 0 2px 16px; margin-bottom: 20px; }
.aviso-turma:last-child { margin-bottom: 0; }
.aviso-turma h3 { margin: 0 0 3px; font-size: 21px; }
.aviso-turma .data { font-size: .6rem; letter-spacing: .26em; text-transform: uppercase; color: var(--texto-suave); }
.aviso-turma p { margin: 5px 0 0; font-size: 13.5px; }

.dado { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.dado:last-child { border-bottom: 0; }
.dado span { color: var(--texto-suave); }
.dado b { text-align: right; font-weight: 600; }

/* contagem para o baile */
.contagem { display: flex; gap: 10px; margin-top: 20px; }
.contagem div { flex: 1; text-align: center; background: var(--superficie-2); border-radius: var(--raio); padding: 14px 6px; }
.contagem b { display: block; font-family: var(--serif); font-size: 30px; line-height: 1; }
.contagem span { font-size: .55rem; letter-spacing: .2em; text-transform: uppercase; color: var(--texto-suave); }

/* ---------- folha ---------- */
.folha { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.folha[hidden], .toast[hidden] { display: none; } /* [hidden] precisa vencer o display acima */
.folha-fundo { position: absolute; inset: 0; background: rgba(12, 7, 21, .5); animation: surgir .18s ease; }
.folha-corpo {
  position: relative; width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
  background: var(--superficie); border-radius: 14px 14px 0 0; padding: 26px 24px calc(26px + var(--base));
  animation: subir .22s cubic-bezier(.16, 1, .3, 1);
}

}
.acoes { display: grid; gap: 9px; margin-top: 18px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--night); color: var(--cream); padding: 12px 20px; border-radius: 99px;
  font-size: 13px; z-index: 80; box-shadow: var(--sombra); animation: subir .2s ease;
}

.vazio { text-align: center; color: var(--texto-suave); padding: 32px 16px; font-size: 14px; }
.rodape-nota { color: var(--texto-suave); font-size: 11.5px; line-height: 1.6; margin: 28px 2px 0; }

/* ==========================================================================
   Início: faixa de fotos do espaço, frase de impacto e símbolo do curso
   ========================================================================== */

.topo-interno { display: flex; align-items: center; gap: 14px; width: 100%; max-width: var(--coluna); margin: 0 auto; }

/* faixa de fotos que roda */
.faixa-fotos {
  position: relative; border-radius: var(--raio); overflow: hidden;
  background: var(--night); aspect-ratio: 16 / 9; margin-bottom: 12px; box-shadow: var(--sombra);
}
@media (max-width: 640px) { .faixa-fotos { aspect-ratio: 3 / 2; } }
.faixa-fotos figure { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity .9s var(--ease, ease); }
.faixa-fotos figure.ativa { opacity: 1; }
.faixa-fotos img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.faixa-fotos .veu {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(12, 7, 21, .1) 0%, rgba(12, 7, 21, .18) 45%, rgba(12, 7, 21, .82) 100%);
}
.faixa-fotos .legenda {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 24px;
  color: var(--cream); display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
}
.faixa-fotos .legenda .kicker { color: rgba(242, 233, 218, .68); }
.faixa-fotos .legenda strong { display: block; font-family: var(--serif); font-size: 24px; font-weight: 600; margin-top: 4px; }
.faixa-fotos .bolinhas { display: flex; gap: 7px; flex: none; padding-bottom: 5px; }
.faixa-fotos .bolinhas button {
  width: 7px; height: 7px; padding: 0; border-radius: 99px; border: 0; cursor: pointer;
  background: rgba(242, 233, 218, .38); transition: width .25s, background .25s;
}
.faixa-fotos .bolinhas button.ativa { width: 22px; background: var(--cream); }

/* frase de impacto + símbolo do curso */
.frase {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;
  background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio);
  box-shadow: var(--sombra); padding: 28px 30px 26px; margin-bottom: 12px;
}
.frase .simbolo {
  flex: none; width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(123, 78, 194, .07); border: 1px solid rgba(123, 78, 194, .2);
}
.frase .simbolo svg { width: 30px; height: 30px; stroke: var(--violet); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.frase .simbolo svg .cheio { fill: var(--violet); stroke: none; }
.frase p {
  margin: 0; max-width: 46ch; font-family: var(--serif); font-weight: 300;
  font-size: clamp(1.25rem, 2.1vw, 1.7rem); line-height: 1.22; letter-spacing: -.01em;
}

   ========================================================================== */
.hero-financeiro {

.hero-financeiro .par b.ok { color: #8FD9B6; }
.hero-financeiro .par small { display: block; font-size: 11px; color: rgba(242, 233, 218, .5); margin-top: 2px; }

.hero-financeiro .pct { text-align: right; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(242, 233, 218, .6); }

<script>
// API da Área do Formando rodando no próprio navegador.
//
// Mesmas rotas do servidor.mjs (Parte 4 do plano) e mesmas regras de isolamento,
// só que sem servidor: é o que faz a versão publicada funcionar como página
// estática. O app chama window.API_DEMO no lugar do fetch.
//
// Diferenças conscientes para a demonstração:
//   - o token é uma chave de memória, não um JWT assinado (não há servidor para verificar);
//   - o código de acesso aparece na tela, como no ambiente local;
//   - o PDF vira uma prévia na própria tela, porque o visualizador não deixa a
//     página iniciar downloads.
(function () {
  const DADOS = window.DADOS_DEMO;
  const HOJE = DADOS.hojeSimulado;
  const OTP = { expiraMs: 10 * 60 * 1000, tentativas: 5, tetoDiario: 10, janelaMs: 60 * 1000 };

  const codigos = new Map();
  const pedidosDoDia = new Map();
  const sessoes = new Map();   // token -> { adesaoId, etapa? }
  const solicitacoes = [];
  const emitidos = new Set();

  const soDigitos = (s) => String(s || '').replace(/\D/g, '');
  const acharAdesao = (id) => DADOS.adesoes.find((a) => a.adesaoId === id);
  const acharTurma = (id) => DADOS.turmas.find((t) => t.id === id);
  const adesoesPorCpf = (cpf) => DADOS.adesoes.filter((a) => a.cpf === soDigitos(cpf));
  const novoToken = () => 'demo-' + Math.random().toString(36).slice(2) + Date.now().toString(36);

  const mascararEmail = (e) => {
    if (!e) return null;
    const [u, d] = e.split('@');
    return `${u.slice(0, 2)}${'*'.repeat(Math.max(1, u.length - 2))}@${d}`;
  };
  const mascararTelefone = (t) => {
    const d = soDigitos(t);
    return d.length < 4 ? null : `(${d.slice(2, 4)}) *****-${d.slice(-4)}`;
  };

  const erro = (status, corpo) => Object.assign(new Error(corpo.erro), { status, corpo });

  function situacaoBoleto(b) {
    if (b.status === 'agendado' && emitidos.has(b.id)) return 'em_aberto';
    return b.status;
  }

  function projetarBoleto(b) {
    const status = situacaoBoleto(b);
    const emitido = status === 'em_aberto' || status === 'em_atraso';
    return {
      id: b.id, parcela: b.parcela, descricao: b.descricao, vencimento: b.vencimento,
      valor: b.valor, status, pagoEm: b.pagoEm, valorPago: b.valorPago,
      podeEmitir: status === 'agendado' && DADOS.config.permitirEmitirBoletoAgendado,
      temLinhaDigitavel: emitido,
    };
  }

  function resumoFinanceiro(adesao) {
    const bs = adesao.boletos.map((b) => ({ ...b, status: situacaoBoleto(b) }));
    const soma = (f) => Math.round(bs.filter(f).reduce((a, b) => a + b.valor, 0) * 100) / 100;
    const emAberto = bs.filter((b) => b.status === 'em_aberto' || b.status === 'em_atraso');
    const proxima = emAberto
      .concat(bs.filter((b) => b.status === 'agendado' || b.status === 'nao_gerado'))
      .filter((b) => b.vencimento >= HOJE)
      .sort((a, b) => a.vencimento.localeCompare(b.vencimento))[0];
    return {
      contratado: adesao.contrato.total,
      parcelas: adesao.contrato.parcelas,
      mensalidade: adesao.contrato.mensalidade,
      pago: Math.round(bs.filter((b) => b.status === 'pago').reduce((a, b) => a + (b.valorPago || b.valor), 0) * 100) / 100,
      emAberto: soma((b) => b.status === 'em_aberto'),
      emAtraso: soma((b) => b.status === 'em_atraso'),
      aEmitir: soma((b) => b.status === 'agendado' || b.status === 'nao_gerado'),
      parcelasPagas: bs.filter((b) => b.status === 'pago').length,
      proximoVencimento: proxima
        ? { vencimento: proxima.vencimento, valor: proxima.valor, status: proxima.status }
        : null,
    };
  }

  function daSessao(token, { permitirEscolha = false } = {}) {
    const s = sessoes.get(token);
    if (!s || (s.etapa && !permitirEscolha)) throw erro(401, { erro: 'sessao_invalida' });
    if (s.etapa && permitirEscolha) return s;
    const adesao = acharAdesao(s.adesaoId);
    if (!adesao) throw erro(401, { erro: 'sessao_invalida' });
    return adesao;
  }

  const ROTAS = {
    'GET /config': () => ({
      whatsappAtendimento: DADOS.config.whatsappAtendimento,
      nomeAtendimento: DADOS.config.nomeAtendimento,
      permitirEmitirBoletoAgendado: DADOS.config.permitirEmitirBoletoAgendado,
      mostrarReajusteProgramado: DADOS.config.mostrarReajusteProgramado,
      modoDev: true,
      demo: true,
      cpfExemplo: (DADOS.adesoes.find((x) => x.adesaoId === 'ades-7506-teste') || DADOS.adesoes[0]).cpf,
      avisoDados: DADOS.aviso,
      hojeSimulado: HOJE,
    }),

    'POST /auth/otp/solicitar': (_t, corpo) => {
      const doc = soDigitos(corpo.cpf);
      if (doc.length !== 11) throw erro(400, { erro: 'cpf_invalido' });

      const dia = new Date().toISOString().slice(0, 10);
      const contador = pedidosDoDia.get(doc);
      const atual = contador && contador.dia === dia ? contador : { dia, quantidade: 0 };
      if (atual.quantidade >= OTP.tetoDiario) throw erro(429, { erro: 'muitas_tentativas' });

      const anterior = codigos.get(doc);
      if (anterior && Date.now() - anterior.criadoEm < OTP.janelaMs) {
        throw erro(429, { erro: 'aguarde', segundos: Math.ceil((OTP.janelaMs - (Date.now() - anterior.criadoEm)) / 1000) });
      }

      const neutra = { enviado: true, canais: ['whatsapp', 'email'], destinos: {}, expiraEmSegundos: OTP.expiraMs / 1000 };
      const encontradas = adesoesPorCpf(doc);
      // Em produção a resposta é neutra; aqui, como nada é enviado, avisamos.
      if (!encontradas.length) return { ...neutra, cadastrado: false };

      const codigo = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');
      codigos.set(doc, { codigo, expiraEm: Date.now() + OTP.expiraMs, tentativas: 0, criadoEm: Date.now() });
      pedidosDoDia.set(doc, { dia, quantidade: atual.quantidade + 1 });

      const alvo = encontradas[0];
      return {
        ...neutra,
        destinos: { email: mascararEmail(alvo.email), whatsapp: mascararTelefone(alvo.telefone) },
        codigoDev: codigo,
      };
    },

    'POST /auth/otp/verificar': (_t, corpo) => {
      const doc = soDigitos(corpo.cpf);
      const guardado = codigos.get(doc);
      if (!guardado || guardado.expiraEm < Date.now()) throw erro(401, { erro: 'codigo_invalido' });
      if (guardado.tentativas >= OTP.tentativas) throw erro(429, { erro: 'muitas_tentativas' });
      guardado.tentativas += 1;
      if (String(corpo.codigo || '') !== guardado.codigo) throw erro(401, { erro: 'codigo_invalido' });
      codigos.delete(doc);

      const encontradas = adesoesPorCpf(doc);
      if (encontradas.length > 1) {
        const token = novoToken();
        sessoes.set(token, { etapa: 'escolha', cpf: doc });
        return {
          precisaEscolherTurma: true,
          tokenEscolha: token,
          turmas: encontradas.map((a) => {
            const t = acharTurma(a.turmaId);
            return { adesaoId: a.adesaoId, turma: t.rotulo, curso: a.curso, dataEvento: t.dataEvento, cidade: t.cidade };
          }),
        };
      }

      const token = novoToken();
      sessoes.set(token, { adesaoId: encontradas[0].adesaoId });
      return { token, expiraEm: new Date(Date.now() + 30 * 60000).toISOString() };
    },

    'POST /auth/escolher-turma': (t, corpo) => {
      const s = daSessao(t, { permitirEscolha: true });
      if (!s.etapa) throw erro(401, { erro: 'sessao_invalida' });
      const adesao = acharAdesao(corpo.adesaoId);
      if (!adesao || adesao.cpf !== s.cpf) throw erro(404, { erro: 'nao_encontrado' });
      const token = novoToken();
      sessoes.set(token, { adesaoId: adesao.adesaoId });
      return { token, expiraEm: new Date(Date.now() + 30 * 60000).toISOString() };
    },

    'GET /me': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      return {
        nome: a.nome, primeiroNome: a.nome.split(' ')[0], curso: a.curso,
        situacao: a.situacao, canceladaEm: a.canceladaEm,
        turma: { codigo: turma.codigo, rotulo: turma.rotulo, dataEvento: turma.dataEvento, cidade: turma.cidade },
      };
    },

    'GET /financeiro': (t) => {
      const a = daSessao(t);
      if (a.situacao === 'cancelada') throw erro(409, { erro: 'adesao_cancelada', canceladaEm: a.canceladaEm });
      return {
        resumo: resumoFinanceiro(a),
        reajuste: DADOS.config.mostrarReajusteProgramado ? a.reajuste : null,
        boletos: a.boletos.map(projetarBoleto),
      };
    },

    'GET /contrato': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      return {
        termo: {
          assinadoEm: a.contrato.assinadoEm,
          origem: a.contrato.docusealSubmissionId ? 'docuseal' : 'anexo',
          url: a.contrato.termoUrl,
        },
        contratoColetivo: { turma: turma.rotulo, url: a.contrato.contratoColetivoUrl },
        contratado: {
          total: a.contrato.total, parcelas: a.contrato.parcelas,
          mensalidade: a.contrato.mensalidade, primeiraParcela: a.contrato.primeiraParcela,
        },
        convites: a.convites,
        solicitacoes: solicitacoes.filter((s) => s.adesaoId === a.adesaoId),
      };
    },

    'POST /solicitacoes': (t, corpo) => {
      const a = daSessao(t);
      if (!['convites_extras', 'outro'].includes(corpo.tipo)) throw erro(400, { erro: 'tipo_invalido' });
      const s = {
        id: `sol-${solicitacoes.length + 1}`,
        adesaoId: a.adesaoId,
        tipo: corpo.tipo,
        payload: { mensagem: String(corpo.mensagem || '').slice(0, 1000), quantidade: corpo.quantidade || null, conviteTipo: corpo.conviteTipo || null },
        status: 'aberta',
        criadoEm: new Date().toISOString(),
      };
      solicitacoes.push(s);
      return s;
    },

    'GET /turma': (t) => {
      const a = daSessao(t);
      const turma = acharTurma(a.turmaId);
      return {
        codigo: turma.codigo, rotulo: turma.rotulo, curso: turma.curso, cursos: turma.cursos,
        dataEvento: turma.dataEvento, cidade: turma.cidade, espaco: turma.espaco,
        pacote: turma.pacote, formandos: turma.formandos, consultora: turma.consultora,
        fotos: turma.fotos, cronograma: turma.cronograma, avisos: turma.avisos,
      };
    },
  };

  // Rotas com id no caminho.
  function rotaComId(metodo, caminho, token, corpo) {
    const m1 = caminho.match(/^\/financeiro\/([\w-]+)$/);
    if (metodo === 'GET' && m1) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m1[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });   // boleto de outra pessoa: 404, nunca 403
      const status = situacaoBoleto(b);
      const escondido = status === 'agendado' || status === 'nao_gerado';
      return {
        ...projetarBoleto(b),
        linhaDigitavel: escondido ? null : b.linhaDigitavel,
        pdfUrl: escondido ? null : b.pdfUrl,
        urlPagamento: escondido ? null : b.urlPagamento,
      };
    }

    const m2 = caminho.match(/^\/financeiro\/([\w-]+)\/emitir$/);
    if (metodo === 'POST' && m2) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m2[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      if (situacaoBoleto(b) !== 'agendado') throw erro(409, { erro: 'boleto_nao_agendado', status: situacaoBoleto(b) });
      emitidos.add(b.id);
      b.linhaDigitavel = b.linhaDigitavel || linhaFalsa(b.id);
      b.pdfUrl = b.pdfUrl || `#/boleto/${b.id}`;
      b.urlPagamento = b.urlPagamento || `#/pagar/${b.id}`;
      return { ...projetarBoleto(b), linhaDigitavel: b.linhaDigitavel, pdfUrl: b.pdfUrl, urlPagamento: b.urlPagamento };
    }

    // Os dados que o PDF mostraria. A página monta a prévia na tela.
    const m3 = caminho.match(/^\/financeiro\/([\w-]+)\/pdf$/);
    if (metodo === 'GET' && m3) {
      const a = daSessao(token);
      const b = a.boletos.find((x) => x.id === m3[1]);
      if (!b) throw erro(404, { erro: 'nao_encontrado' });
      const turma = acharTurma(a.turmaId);
      return {
        demo: true,
        formando: a.nome,
        cpf: a.cpf.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4'),
        turma: turma.rotulo,
        evento: turma.eventoCrm,
        parcela: b.parcela,
        totalParcelas: a.contrato.parcelas,
        descricao: b.descricao,
        vencimento: b.vencimento,
        valor: b.valor,
        status: situacaoBoleto(b),
        pagoEm: b.pagoEm,
        linhaDigitavel: situacaoBoleto(b) === 'agendado' || situacaoBoleto(b) === 'nao_gerado' ? null : b.linhaDigitavel,
      };
    }

    return undefined;
  }

  function linhaFalsa(semente) {
    let h = 0;
    for (const c of String(semente)) h = (h * 31 + c.charCodeAt(0)) % 1e9;
    const d = String(h).repeat(8);
    return `34191.${d.slice(0, 5)} ${d.slice(5, 10)}.${d.slice(10, 16)} ${d.slice(16, 21)}.${d.slice(21, 27)} 9 ${d.slice(27, 37)}`;
  }

  // Ponto de entrada usado pelo app no lugar do fetch.
  window.API_DEMO = function (metodo, caminho, corpo, token) {
    const direta = ROTAS[`${metodo} ${caminho}`];
    const resposta = direta ? direta(token, corpo || {}) : rotaComId(metodo, caminho, token, corpo || {});
    if (resposta === undefined) throw erro(404, { erro: 'rota_nao_encontrada' });
    return resposta;
  };
})();

</script>
<script>
// Área do Formando — front do protótipo local.
// Conversa só com os endpoints /area-formando/* descritos na Parte 4 do plano.
// Trocar pela API real depois = mudar API_BASE e de onde vem o token.

const API_BASE = '/area-formando';
const app = document.getElementById('app');
const folha = document.getElementById('folha');
const toast = document.getElementById('aviso-flutuante');

const estado = {
  token: null,
  tokenEscolha: null,
  cpf: '',
  config: null,
  eu: null,
  financeiro: null,
  contrato: null,
  turma: null,
  aba: 'inicio',
  filtro: 'todas',
  menuAberto: false,
};

// ---------- utilidades -------------------------------------------------------
const guardar = (t) => { try { sessionStorage.setItem('formando_token', t); } catch { /* modo privado */ } };
const recuperar = () => { try { return sessionStorage.getItem('formando_token'); } catch { return null; } };
const esquecer = () => { try { sessionStorage.removeItem('formando_token'); } catch { /* ignora */ } };

const brl = (v) => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataCurta = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
const dataLonga = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : '—';
const mesAno = (iso) => iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) : '—';
const escapar = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Tira o "(TESTE)" do nome do cadastro de teste na hora de mostrar na tela.
const semMarca = (n) => String(n || '').replace(/\s*\(TESTE\)\s*/i, '').trim();

const hoje = () => estado.config?.hojeSimulado || new Date().toISOString().slice(0, 10);
const diasAte = (iso) => Math.round((new Date(`${iso}T12:00:00`) - new Date(`${hoje()}T12:00:00`)) / 86400000);

const ROTULO_STATUS = {
  pago: 'Pago', em_aberto: 'Em aberto', em_atraso: 'Em atraso',
  agendado: 'A emitir', nao_gerado: 'Programada',
};

function avisar(texto) {
  toast.textContent = texto;
  toast.hidden = false;
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => { toast.hidden = true; }, 2600);
}

async function chamar(caminho, opcoes = {}) {
  // Na versão publicada não há servidor: a mesma API roda no navegador.
  if (window.API_DEMO) {
    const corpo = opcoes.body ? JSON.parse(opcoes.body) : null;
    return window.API_DEMO(opcoes.method || 'GET', caminho, corpo, estado.token || estado.tokenEscolha);
  }
  const resposta = await fetch(API_BASE + caminho, {
    ...opcoes,
    headers: {
      'content-type': 'application/json',
      ...(estado.token || estado.tokenEscolha ? { authorization: `Bearer ${estado.token || estado.tokenEscolha}` } : {}),
      ...opcoes.headers,
    },
  });
  const corpo = await resposta.json().catch(() => ({}));
  if (!resposta.ok) throw Object.assign(new Error(corpo.erro || 'falha'), { status: resposta.status, corpo });
  return corpo;
}

function abrirFolha(html, depois) {
  folha.querySelector('.folha-corpo').innerHTML = html;
  folha.hidden = false;
  if (depois) depois(folha.querySelector('.folha-corpo'));
}
const fecharFolha = () => { folha.hidden = true; };
folha.addEventListener('click', (e) => { if (e.target.hasAttribute('data-fechar-folha')) fecharFolha(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharFolha(); });

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch {
    const campo = document.createElement('textarea');
    campo.value = texto; document.body.appendChild(campo); campo.select();
    document.execCommand('copy'); campo.remove();
  }
  avisar('Linha digitável copiada');
}

// ---------- tela: entrar -----------------------------------------------------
function mascaraCpf(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}

const marca = () => `
  <div class="marca">
    <img src="logo-formaturas.png" alt="Indaiá Formaturas" />
    <div class="assinatura">transformando histórias.</div>
  </div>`;

function telaEntrar(erro) {
  app.className = 'entrar';
  app.innerHTML = `
    <div class="entrar-caixa">
      ${marca()}
      <div class="cartao">
        <div class="kicker">Área do Formando</div>
        <h1>Acesse sua <span class="grifo">conta</span></h1>
        <p class="sub">Informe seu CPF para receber um código de acesso por WhatsApp ou e-mail.</p>
        <form id="form-cpf" novalidate>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="${escapar(mascaraCpf(estado.cpf))}" />
          </div>
          ${erro ? `<p class="erro">${escapar(erro)}</p>` : ''}
          <button class="botao" type="submit">Receber código</button>
        </form>
        ${estado.config?.cpfExemplo ? `
          <div class="dev">
            Ambiente de teste: nenhum código é enviado por e-mail ou WhatsApp — ele aparece
            aqui na tela. Entre com <strong class="cpf">${escapar(mascaraCpf(estado.config.cpfExemplo))}</strong>
          </div>` : ''}
      </div>
      ${notaRodape()}
    </div>`;

  const campo = app.querySelector('#cpf');
  campo.addEventListener('input', () => { campo.value = mascaraCpf(campo.value); });
  app.querySelector('#form-cpf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const cpf = campo.value.replace(/\D/g, '');
    if (cpf.length !== 11) return telaEntrar('Digite os 11 números do CPF.');
    estado.cpf = cpf;
    const botao = app.querySelector('button[type=submit]');
    botao.disabled = true; botao.textContent = 'Enviando…';
    try {
      const r = await chamar('/auth/otp/solicitar', { method: 'POST', body: JSON.stringify({ cpf }) });
      // Em produção a resposta é sempre a mesma, exista o CPF ou não. No protótipo,
      // onde nada é enviado, ficar na tela do código sem código só confunde.
      if (r.cadastrado === false) {
        const sugerido = estado.config?.cpfExemplo ? ` Use ${mascaraCpf(estado.config.cpfExemplo)}.` : '';
        return telaEntrar(`Esse CPF não está nos dados de exemplo.${sugerido}`);
      }
      telaCodigo(r);
    } catch (err) {
      const mensagens = {
        cpf_invalido: 'CPF inválido.',
        aguarde: `Aguarde ${err.corpo?.segundos || 60} segundos para pedir outro código.`,
        muitas_tentativas: 'Você já pediu muitos códigos hoje. Fale com a gente pelo WhatsApp.',
      };
      telaEntrar(mensagens[err.message] || 'Não foi possível enviar o código agora.');
    }
  });
}

function telaCodigo(envio, erro) {
  app.className = 'entrar';
  const destinos = [envio.destinos?.whatsapp, envio.destinos?.email].filter(Boolean);
  app.innerHTML = `
    <div class="entrar-caixa">
      ${marca()}
      <div class="cartao">
        <div class="kicker">Código de acesso</div>
        <h1>Digite o código</h1>
        <p class="sub">${destinos.length ? escapar(`Enviado para ${destinos.join(' e ')}.`) : 'Se o CPF estiver cadastrado, o código já foi enviado.'}</p>
        <form id="form-codigo" novalidate>
          <div class="campo">
            <label for="codigo">6 dígitos</label>
            <input id="codigo" class="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" />
            <div class="dica">Vale por 10 minutos.</div>
          </div>
          ${erro ? `<p class="erro">${escapar(erro)}</p>` : ''}
          <button class="botao" type="submit">Entrar</button>
          <button class="botao fantasma" type="button" id="voltar">Usar outro CPF</button>
        </form>
        ${envio.codigoDev ? `<div class="dev">Ambiente de teste — o código é <strong>${escapar(envio.codigoDev)}</strong>. Em produção ele só chega por WhatsApp e e-mail.</div>` : ''}
      </div>
    </div>`;

  const campo = app.querySelector('#codigo');
  campo.focus();
  campo.addEventListener('input', () => { campo.value = campo.value.replace(/\D/g, ''); });
  app.querySelector('#voltar').addEventListener('click', () => telaEntrar());
  app.querySelector('#form-codigo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const botao = app.querySelector('button[type=submit]');
    botao.disabled = true; botao.textContent = 'Verificando…';
    try {
      const r = await chamar('/auth/otp/verificar', { method: 'POST', body: JSON.stringify({ cpf: estado.cpf, codigo: campo.value }) });
      if (r.precisaEscolherTurma) { estado.tokenEscolha = r.tokenEscolha; return telaEscolherTurma(r.turmas); }
      estado.token = r.token; guardar(r.token);
      await entrar();
    } catch (err) {
      const mensagens = {
        codigo_invalido: 'Código incorreto ou expirado.',
        muitas_tentativas: 'Muitas tentativas. Peça um código novo.',
      };
      telaCodigo(envio, mensagens[err.message] || 'Não foi possível entrar agora.');
    }
  });
}

            </button>`).join('')}
        </div>
        <button class="botao fantasma" type="button" id="voltar">Voltar</button>
      </div>
    </div>`;

// Sem escolha salva, vale o tema do sistema. A escolha fica no navegador.
const temaAtual = () => {
  try {
    const salvo = localStorage.getItem('formando_tema');
    if (salvo) return salvo;
  } catch { /* modo privado */ }
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
};

function aplicarTema(tema) {
  document.documentElement.setAttribute('data-tema', tema);
  try { localStorage.setItem('formando_tema', tema); } catch { /* segue sem lembrar */ }
}

function alternarTema() {
  aplicarTema(temaAtual() === 'escuro' ? 'claro' : 'escuro');
  if (estado.eu) irPara(estado.aba);
}

// ---------- pedaços reaproveitados ------------------------------------------
function proximaParaPagar() {
  const bs = estado.financeiro?.boletos || [];
  const ordem = { em_atraso: 0, em_aberto: 1, agendado: 2, nao_gerado: 3 };
  return bs.filter((b) => b.status !== 'pago')
    .sort((a, b) => (ordem[a.status] - ordem[b.status]) || a.vencimento.localeCompare(b.vencimento))[0];
}

function cartaoDestaque(b) {
  if (!b) return '';
  const atraso = b.status === 'em_atraso';
  return `
    <div class="cartao destaque">
      <div class="rotulo">${atraso ? 'Parcela em atraso' : 'Próxima parcela'}</div>
      <div class="valor-grande">${brl(b.valor)}</div>
      <div class="quando">Parcela ${b.parcela} · ${atraso ? `venceu em ${dataCurta(b.vencimento)}` : `vence em ${dataCurta(b.vencimento)}`}</div>
      <div class="acoes"><button class="botao" data-boleto="${escapar(b.id)}">${b.status === 'agendado' ? 'Quero pagar agora' : 'Ver boleto'}</button></div>
    </div>`;
}

function itemBoleto(b) {
  const clicavel = b.status !== 'nao_gerado';
  return `
    <button class="item ${clicavel ? '' : 'inerte'}" ${clicavel ? `data-boleto="${escapar(b.id)}"` : ''}>
      <div class="quando">
        <strong>Parcela ${b.parcela} · ${mesAno(b.vencimento)}</strong>
        <span>${b.status === 'pago' ? `Pago em ${dataCurta(b.pagoEm)}` : `Vence em ${dataCurta(b.vencimento)}`}</span>
        <br><span class="marca-status s-${b.status}">${ROTULO_STATUS[b.status]}</span>
      </div>
      <div class="quanto"><b>${brl(b.valor)}</b></div>
      ${clicavel ? '<div class="seta">›</div>' : ''}
    </button>`;
}

const ligarBoletos = () => app.querySelectorAll('[data-boleto]').forEach((b) => b.addEventListener('click', () => abrirBoleto(b.dataset.boleto)));

// Faixa de fotos do espaço, no topo do Início. Troca sozinha a cada 5 s e para
// enquanto o ponteiro está em cima.
function faixaFotos(fotos, espaco) {
  if (!fotos?.length) return '';
  return `
    <div class="faixa-fotos" id="faixa">
      ${fotos.map((f, i) => `
        <figure class="${i === 0 ? 'ativa' : ''}" data-foto="${i}">
          <img src="fotos/${escapar(f.arquivo)}" alt="${escapar(f.legenda)}" loading="${i === 0 ? 'eager' : 'lazy'}" />
        </figure>`).join('')}
      <div class="veu"></div>
      <div class="legenda">
        <div>
          <div class="kicker">${escapar(espaco || 'O seu espaço')}</div>
          <strong id="faixa-legenda">${escapar(fotos[0].legenda)}</strong>
        </div>
        <div class="bolinhas">
          ${fotos.map((_, i) => `<button data-ir-foto="${i}" class="${i === 0 ? 'ativa' : ''}" aria-label="Foto ${i + 1}"></button>`).join('')}
        </div>
      </div>
    </div>`;
}

function ligarFaixa(fotos) {
  const faixa = app.querySelector('#faixa');
  if (!faixa || !fotos?.length) return;
  const legenda = app.querySelector('#faixa-legenda');
  let atual = 0;

  const mostrar = (i) => {
    atual = (i + fotos.length) % fotos.length;
    faixa.querySelectorAll('[data-foto]').forEach((f, j) => f.classList.toggle('ativa', j === atual));
    faixa.querySelectorAll('[data-ir-foto]').forEach((b, j) => b.classList.toggle('ativa', j === atual));
    legenda.textContent = fotos[atual].legenda;
  };

  faixa.querySelectorAll('[data-ir-foto]').forEach((b) => b.addEventListener('click', () => {
    mostrar(Number(b.dataset.irFoto));
    reiniciar();
  }));

  let timer = null;
  const reiniciar = () => { clearInterval(timer); timer = setInterval(() => mostrar(atual + 1), 5000); };
  faixa.addEventListener('mouseenter', () => clearInterval(timer));
  faixa.addEventListener('mouseleave', reiniciar);
  reiniciar();
}

// Mesmos recortes dos chips da Área do Cliente (Todas · Vencidas · Aguardando ·
// Pendentes · Pagas), com os nomes que valem para formatura.
const FILTROS = [
  { id: 'todas', rotulo: 'Todas', teste: () => true },
  { id: 'vencidas', rotulo: 'Vencidas', teste: (b) => b.status === 'em_atraso' },
  { id: 'aguardando', rotulo: 'Aguardando', teste: (b) => b.status === 'em_aberto' },
  { id: 'programadas', rotulo: 'Programadas', teste: (b) => b.status === 'agendado' || b.status === 'nao_gerado' },
  { id: 'pagas', rotulo: 'Pagas', teste: (b) => b.status === 'pago' },
];

function abaFinanceiro() {
  const { resumo, boletos, reajuste } = estado.financeiro;
  const pct = resumo.contratado ? Math.min(100, (resumo.pago / resumo.contratado) * 100) : 0;
  const filtro = FILTROS.find((f) => f.id === estado.filtro) || FILTROS[0];
  const lista = boletos.filter(filtro.teste).sort((a, b) => (filtro.id === 'pagas' ? -1 : 1) * a.vencimento.localeCompare(b.vencimento));
  const proxima = proximaParaPagar();

  const emAberto = resumo.emAberto + resumo.emAtraso + resumo.aEmitir;
  const atrasadas = boletos.filter((b) => b.status === 'em_atraso');

  moldura(`
    <div class="hero-financeiro">
      <div class="kicker">Total do contrato · turma ${escapar(estado.eu?.turma?.codigo || '')}</div>
      <div class="total">${brl(resumo.contratado)}</div>
      <div class="par">
        <div>
          <div class="rot">Pago</div>
          <b class="ok">${brl(resumo.pago)}</b>
          <small>${resumo.parcelasPagas} parcela${resumo.parcelasPagas === 1 ? '' : 's'}</small>
        </div>
        <div>
          <div class="rot">Em aberto</div>
          <b>${brl(emAberto)}</b>
          <small>${resumo.parcelas - resumo.parcelasPagas} parcelas</small>
        </div>
      </div>
      <div class="trilho"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="pct">${pct.toFixed(0)}% pago</div>
      ${atrasadas.length ? `
        <div class="atraso">
          <span>${atrasadas.length} parcela${atrasadas.length > 1 ? 's' : ''} em atraso</span>
          <b>${brl(resumo.emAtraso)}</b>
        </div>` : ''}
    </div>

    ${proxima ? cartaoDestaque(proxima) : ''}

    ${reajuste && !reajuste.aplicado ? `<div class="faixa ouro">Reajuste ${escapar(reajuste.indice)} programado para ${mesAno(reajuste.proximoCiclo)}. A parcela passa de ${brl(reajuste.valorAtual)} para cerca de ${brl(reajuste.valorEstimado)} — o valor final sai quando o índice for publicado.</div>` : ''}

    <div class="secao-titulo">Minhas parcelas</div>
    <div class="filtros">
      ${FILTROS.map((f) => {
        const n = boletos.filter(f.teste).length;
        return `<button data-filtro="${f.id}" class="${f.id === estado.filtro ? 'ativo' : ''}"><i class="ponto p-${f.id}"></i>${f.rotulo} · ${n}</button>`;
      }).join('')}
    </div>
    ${lista.length ? listaPorAno(lista)
      : '<div class="cartao plano"><div class="vazio">Nenhuma parcela nesta situação.</div></div>'}

    <p class="rodape-nota">As parcelas marcadas como <b>programada</b> ainda não têm boleto — ele é gerado alguns dias antes do vencimento. As marcadas como <b>a emitir</b> você pode adiantar por aqui.</p>
    ${notaRodape()}
  `, `${resumo.parcelasPagas} de ${resumo.parcelas} parcelas pagas`);

  app.querySelectorAll('[data-filtro]').forEach((b) => b.addEventListener('click', () => { estado.filtro = b.dataset.filtro; abaFinanceiro(); }));
  ligarBoletos();
}

// Com 30+ parcelas a lista vira um paredão: agrupa por ano, como a Área do
// Cliente faz por mês. Abre o ano corrente e o que tiver parcela em atraso.
function listaPorAno(boletos) {
  const anos = [...new Set(boletos.map((b) => b.vencimento.slice(0, 4)))];
  if (anos.length === 1) return `<div class="lista">${boletos.map(itemBoleto).join('')}</div>`;

  const anoAtual = hoje().slice(0, 4);
  return anos.map((ano) => {
    const doAno = boletos.filter((b) => b.vencimento.startsWith(ano));
    const total = doAno.reduce((a, b) => a + b.valor, 0);
    const temAtraso = doAno.some((b) => b.status === 'em_atraso');
    const aberto = ano === anoAtual || temAtraso;
    return `
      <details class="grupo-ano" ${aberto ? 'open' : ''}>
        <summary>
          <span class="ano">${ano}</span>
          <span class="qtd">${doAno.length} parcela${doAno.length === 1 ? '' : 's'}${temAtraso ? ' · <b class="atrasada">1 em atraso</b>' : ''}</span>
          <span class="soma">${brl(total)}</span>
        </summary>
        <div class="lista">${doAno.map(itemBoleto).join('')}</div>
      </details>`;
  }).join('');
}

// O PDF sai de /financeiro/:id/pdf, que exige o token — por isso vem por fetch e
// não por link direto. O blob é aberto numa aba nova.
async function baixarPdf(id) {
  const resposta = await fetch(`${API_BASE}/financeiro/${id}/pdf`, {
    headers: { authorization: `Bearer ${estado.token}` },
  });
  if (!resposta.ok) throw new Error('falha');
  return resposta.blob();
}

function previaBoleto(d) {

        <div class="linha-digitavel">${escapar(d.linhaDigitavel)}</div>` : ''}

    publicada, o navegador não deixa a página iniciar downloads — então o boleto aparece na tela.</p>
    <div class="acoes"><button class="botao fantasma" data-fechar-folha>Fechar</button></div>
  `);
}

async function abrirPdf(id, b) {
  if (estado.config?.demo) {
    try { return previaBoleto(await chamar(`/financeiro/${id}/pdf`)); }
    catch { return avisar('Não foi possível abrir o boleto agora'); }
  }
  avisar('Gerando o PDF…');
  try {
    const blob = await baixarPdf(id);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.download = `parcela-${b.parcela}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch { avisar('Não foi possível abrir o PDF agora'); }
}

// Compartilhar: no celular abre a folha nativa (WhatsApp, e-mail, arquivos) com o
// PDF anexado; sem suporte a arquivo, manda só o texto; sem Web Share, cai no
// WhatsApp Web.
async function compartilharBoleto(id, b) {
  const texto = [
    `Parcela ${b.parcela} · ${escapar(estado.eu?.turma?.rotulo || '')}`.replace(/&[a-z]+;/g, ' '),
    `Vencimento: ${dataCurta(b.vencimento)}`,
    `Valor: ${brl(b.valor)}`,
    b.linhaDigitavel ? `Linha digitável: ${b.linhaDigitavel}` : '',
  ].filter(Boolean).join('\n');

  try {
    if (estado.config?.demo) throw new Error('sem arquivo na demonstração');
    const blob = await baixarPdf(id);
    const arquivo = new File([blob], `parcela-${b.parcela}.pdf`, { type: 'application/pdf' });
    if (navigator.canShare?.({ files: [arquivo] })) {
      await navigator.share({ title: `Parcela ${b.parcela}`, text: texto, files: [arquivo] });
      return;
    }
  } catch (err) {
    if (err?.name === 'AbortError') return; // a pessoa fechou a folha de compartilhamento
  }

  try {
    if (navigator.share) { await navigator.share({ title: `Parcela ${b.parcela}`, text: texto }); return; }
  } catch (err) {
    if (err?.name === 'AbortError') return;
  }

  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
}

const TIPO_ETAPA = {
  evento: 'Evento', reuniao: 'Reunião', prazo: 'Prazo', marco: 'Marco', baile: 'O grande dia',
};

function abaCronograma() {
  const t = estado.turma;
  const etapas = [...t.cronograma].sort((a, b) => a.data.localeCompare(b.data));
  const proxima = etapas.find((e) => e.data >= hoje());
  const feitas = etapas.filter((e) => e.data < hoje()).length;

  // Agrupa por ano, para a lista longa não virar um paredão.
  const anos = [...new Set(etapas.map((e) => e.data.slice(0, 4)))];

  const quando = (iso) => {
    const d = diasAte(iso);
    if (d < 0) return `há ${Math.abs(d)} dia${Math.abs(d) === 1 ? '' : 's'}`;
    if (d === 0) return 'hoje';
    if (d === 1) return 'amanhã';
    if (d < 60) return `em ${d} dias`;
    const meses = Math.round(d / 30);
    return `em ${meses} meses`;
  };

  moldura(`
    <div class="cartao">
      <div class="kicker traco">Da adesão ao baile</div>
      <h2 class="serif" style="margin:8px 0 4px;font-size:30px">${etapas.length} etapas até a <em>formatura</em></h2>
      <p style="margin:0;color:var(--texto-suave);font-size:13.5px">
        ${feitas} já ${feitas === 1 ? 'aconteceu' : 'aconteceram'} · ${etapas.length - feitas} pela frente
        ${proxima ? ` · a próxima é <b>${escapar(proxima.etapa)}</b>, ${quando(proxima.data)}` : ''}
      </p>
      <div class="contagem">
        <div><b>${diasAte(t.dataEvento)}</b><span>dias para o baile</span></div>
        <div><b>${feitas}/${etapas.length}</b><span>etapas cumpridas</span></div>
        <div><b>${anos.length}</b><span>anos de jornada</span></div>
      </div>
    </div>

    ${anos.map((ano) => `
      <div class="crono-ano"><span>${ano}</span><i></i></div>
      ${etapas.filter((e) => e.data.startsWith(ano)).map((e) => {
        const passou = e.data < hoje();
        const eh = e === proxima;
        const d = new Date(`${e.data}T12:00:00`);
        return `
          <div class="crono-item ${passou ? 'passado' : ''} ${eh ? 'proximo' : ''}">
            <div class="crono-data">
              <b>${String(d.getDate()).padStart(2, '0')}</b>
              <span>${d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')}</span>
            </div>
            <div class="crono-corpo">
              <h3>${escapar(e.etapa)}</h3>
              <p>${escapar(e.local || '')}${e.observacao ? `${e.local ? ' — ' : ''}${escapar(e.observacao)}` : ''}</p>
              <div class="crono-tags">
                <span class="crono-tag t-${e.tipo || 'marco'}">${TIPO_ETAPA[e.tipo] || 'Etapa'}</span>
                <span class="crono-quando">${passou ? 'já aconteceu' : quando(e.data)}</span>
                ${eh ? '<span class="crono-tag t-baile">Próxima</span>' : ''}
              </div>
            </div>
          </div>`;
      }).join('')}
    `).join('')}

    <p class="rodape-nota">As datas são confirmadas pela equipe e pela comissão da turma. Quando algo mudar, o aviso aparece aqui e em Minha turma.</p>
    ${notaRodape()}
  `, `${feitas} de ${etapas.length} etapas cumpridas`);
}

        <div class="dado"><span>Curso</span><b>${escapar(t.cursos.join(' · '))}</b></div>
        <div class="dado"><span>Formandos</span><b>${t.formandos}</b></div>
        <div class="dado"><span>Consultora</span><b>${escapar(t.consultora)}</b></div>
      </div>
    </div>

    <div class="cartao">
      <div class="kicker traco">Pacote contratado</div>
      <p style="margin:6px 0 0">${escapar(t.pacote)}</p>
    </div>

    ${t.avisos?.length ? `
      <div class="secao-titulo">Avisos da equipe</div>
      <div class="cartao">
        ${t.avisos.map((a) => `
          <div class="aviso-turma">
            <div class="data">${dataCurta(a.publicadoEm)}</div>
            <h3>${escapar(a.titulo)}</h3>
            <p>${escapar(a.texto)}</p>
          </div>`).join('')}
      </div>` : ''}

    ${proxima ? `
      <div class="secao-titulo">Próximo passo</div>
      <div class="cartao">
        <div class="kicker">${dataLonga(proxima.data)}</div>
        <h3 class="serif" style="margin:4px 0 2px;font-size:22px">${escapar(proxima.etapa)}</h3>
        <p style="margin:0 0 16px;color:var(--texto-suave);font-size:13.5px">${escapar(proxima.local || '')}${proxima.observacao ? ` — ${escapar(proxima.observacao)}` : ''}</p>
        <button class="botao secundario" data-ir="cronograma">Ver o cronograma inteiro</button>
      </div>` : ''}
    ${notaRodape()}
  `, escapar(t.rotulo));

  app.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => irPara(b.dataset.ir)));
}

function abrirWhatsapp() {
  const numero = estado.config?.whatsappAtendimento;
  if (!numero) return avisar('WhatsApp do atendimento não configurado');
  const texto = encodeURIComponent(`Oi! Sou ${estado.eu?.nome || ''}, da turma ${estado.eu?.turma?.codigo || ''}.`);
  window.open(`https://wa.me/${numero}?text=${texto}`, '_blank', 'noopener');
}

// ---------- orquestração -----------------------------------------------------
async function irPara(aba) {
  estado.aba = aba;
  try {
    if (aba === 'inicio') {
      [estado.financeiro, estado.turma] = await Promise.all([chamar('/financeiro'), chamar('/turma')]);
      abaInicio();
    }
    if (aba === 'financeiro') { estado.financeiro = await chamar('/financeiro'); abaFinanceiro(); }
    if (aba === 'cronograma') { estado.turma = await chamar('/turma'); abaCronograma(); }
    if (aba === 'contrato') { estado.contrato = await chamar('/contrato'); abaContrato(); }
    if (aba === 'turma') { estado.turma = await chamar('/turma'); abaTurma(); }
  } catch (err) {
    if (err.status === 401) return sair();
    if (err.message === 'adesao_cancelada') return telaCancelada();
    avisar('Não foi possível carregar agora');
  }
}

async function entrar() {
  estado.eu = await chamar('/me');
  if (estado.eu.situacao === 'cancelada') return telaCancelada();
  await irPara('inicio');
}

function sair() {
  esquecer();
  estado.token = null; estado.eu = null; estado.financeiro = null;
  estado.contrato = null; estado.turma = null;
  estado.aba = 'inicio'; estado.filtro = 'aberto'; estado.menuAberto = false;
  telaEntrar();
}

(async function iniciar() {
  aplicarTema(temaAtual());
  try { estado.config = await chamar('/config'); } catch { /* segue sem config */ }
  const guardado = recuperar();
  if (guardado) {
    estado.token = guardado;
    try { return await entrar(); } catch { esquecer(); estado.token = null; }
  }
  telaEntrar();
})();

</script>
